<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode Roulette</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Episode Roulette">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════════════════════════════
           Episode Roulette — Dashing-style tiles on a white studio backdrop,
           with broadcast/CRT theming (colour bars, ON AIR, timecode,
           scanlines, standby screen).
           ══════════════════════════════════════════════════════════════════ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Studio neutrals — the page itself stays white */
            --paper:      #ffffff;
            --paper-2:    #f4f6f9;
            --ink:        #14171c;
            --ink-soft:   #5c6672;
            --ink-faint:  #8b95a1;
            --rule:       #e2e6ec;
            --rule-soft:  #eef1f5;
            --rec:        #e0242b;

            /* SMPTE colour-bar strip */
            --bar-white:   #f2f2f2;
            --bar-yellow:  #f5d300;
            --bar-cyan:    #00c2d1;
            --bar-green:   #00a651;
            --bar-magenta: #c026a3;
            --bar-red:     #e0242b;
            --bar-blue:    #2f6fb0;

            /* Per-channel defaults, overridden by the .*-btn/.*-card rules:
               --tile        solid tile fill (Dashing widget colour)
               --tile-ink    text drawn on top of that fill
               --tile-strong readable version of the colour on white */
            --tile:        #2c3e50;
            --tile-ink:    #ffffff;
            --tile-strong: #2c3e50;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 18px 56px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── CRT scanlines: barely-there texture, keeps the page white ── */
        .scan-lines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(20, 23, 28, 0.035) 0px,
                rgba(20, 23, 28, 0.035) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* ── SMPTE colour bars pinned to the top of the screen ── */
        .color-bars {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 6px;
            display: flex;
            z-index: 100;
        }
        .color-bars span { flex: 1; }
        .color-bars span:nth-child(1) { background: var(--bar-white); }
        .color-bars span:nth-child(2) { background: var(--bar-yellow); }
        .color-bars span:nth-child(3) { background: var(--bar-cyan); }
        .color-bars span:nth-child(4) { background: var(--bar-green); }
        .color-bars span:nth-child(5) { background: var(--bar-magenta); }
        .color-bars span:nth-child(6) { background: var(--bar-red); }
        .color-bars span:nth-child(7) { background: var(--bar-blue); }

        .container {
            max-width: 620px;
            width: 100%;
            position: relative;
            z-index: 2;
            padding-top: 26px;
        }

        /* ── Masthead / channel ident ────────────────────────────────────── */
        .status-strip {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .on-air {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 2px solid var(--rec);
            border-radius: 3px;
            padding: 4px 9px;
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 0.95em;
            letter-spacing: 0.18em;
            color: var(--rec);
            line-height: 1;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--rec);
            animation: rec-blink 1.6s steps(1, end) infinite;
            flex-shrink: 0;
        }

        @keyframes rec-blink {
            0%, 55%  { opacity: 1; }
            56%, 100%{ opacity: 0.15; }
        }

        .timecode {
            margin-left: auto;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.78em;
            letter-spacing: 0.08em;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        .source-tag {
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.68em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
            border: 1px solid var(--rule);
            border-radius: 3px;
            padding: 4px 8px;
            line-height: 1;
        }

        h1 {
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-weight: 400;
            font-size: 4.2em;
            line-height: 0.92;
            letter-spacing: 0.02em;
            color: var(--ink);
            /* RGB misregistration — the classic video-transfer fringe */
            text-shadow:
                 2px 0 0 rgba(0, 194, 209, 0.45),
                -2px 0 0 rgba(192, 38, 163, 0.4);
        }

        .subtitle {
            margin-top: 10px;
            font-size: 0.72em;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--ink-soft);
            font-weight: 600;
        }

        .masthead-rule {
            height: 3px;
            background: var(--ink);
            margin: 18px 0 24px;
        }

        /* ── Dashing tiles: the channel buttons ──────────────────────────── */
        .show-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 26px;
        }

        .show-btn {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            padding: 26px 16px 20px;
            border: none;
            border-radius: 10px;
            background: var(--tile);
            color: var(--tile-ink);
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.5em;
            line-height: 1.05;
            letter-spacing: 0.06em;
            text-align: center;
            cursor: pointer;
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.22),
                0 10px 22px rgba(20, 23, 28, 0.14);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
        }

        /* Screen glare + scanlines inside every tile */
        .show-btn::before,
        .episode-info::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 46%),
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.07) 0px,
                    rgba(255,255,255,0.07) 1px,
                    transparent 1px,
                    transparent 3px
                );
        }

        .show-btn:hover:not(:disabled) {
            filter: brightness(1.07);
            transform: translateY(-2px);
            box-shadow:
                0 6px 0 rgba(0, 0, 0, 0.22),
                0 14px 26px rgba(20, 23, 28, 0.18);
        }

        .show-btn:not(:disabled):active {
            transform: translateY(3px);
            box-shadow:
                0 1px 0 rgba(0, 0, 0, 0.22),
                0 4px 10px rgba(20, 23, 28, 0.16);
        }

        .show-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .show-btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .ch-label {
            position: absolute;
            top: 9px;
            left: 11px;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.46em;
            letter-spacing: 0.16em;
            opacity: 0.78;
        }

        .show-btn .btn-emoji {
            display: block;
            font-size: 1.35em;
            margin-bottom: 8px;
            line-height: 1;
        }

        .btn-seen-count {
            display: block;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.42em;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 8px;
            min-height: 1em;
        }

        /* ── Channel palette ─────────────────────────────────────────────────
           One rule per show sets the tile fill, the text on it, and a darker
           variant used wherever the colour has to sit on white. */
        .seinfeld-btn,  .seinfeld-card,  .seinfeld-row  { --tile: #2f6fb0; --tile-ink: #fff;    --tile-strong: #2a659f; }
        .familyguy-btn, .familyguy-card, .familyguy-row { --tile: #c9345c; --tile-ink: #fff;    --tile-strong: #b62d51; }
        .simpsons-btn,  .simpsons-card,  .simpsons-row  { --tile: #f2b705; --tile-ink: #241f06; --tile-strong: #8a6600; }
        .southpark-btn, .southpark-card, .southpark-row { --tile: #7b4bb5; --tile-ink: #fff;    --tile-strong: #6f43a4; }
        .koth-btn,      .koth-card,      .koth-row      { --tile: #d1622a; --tile-ink: #fff;    --tile-strong: #ac4e1e; }
        .laworder-btn,  .laworder-card,  .laworder-row  { --tile: #2c3e50; --tile-ink: #fff;    --tile-strong: #2c3e50; }

        /* ── Channel guide (season filters) ──────────────────────────────── */
        .filter-toggle-btn {
            width: 100%;
            padding: 12px 16px;
            background: var(--paper);
            border: 2px solid var(--rule);
            border-radius: 8px;
            color: var(--ink-soft);
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1em;
            letter-spacing: 0.16em;
            cursor: pointer;
            margin-bottom: 12px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .filter-toggle-btn:hover {
            border-color: var(--ink);
            color: var(--ink);
        }

        .filter-panel {
            display: none;
            background: var(--paper);
            border: 2px solid var(--rule);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 22px;
        }
        .filter-panel.open { display: block; }

        .filter-show-row {
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--rule-soft);
        }
        .filter-show-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .filter-show-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.1em;
            letter-spacing: 0.12em;
            color: var(--tile-strong);
            margin-bottom: 10px;
        }
        .filter-show-label::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--tile);
            flex-shrink: 0;
        }

        .season-chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .season-chip {
            padding: 4px 9px;
            border: 1.5px solid var(--tile-strong);
            border-radius: 20px;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.68em;
            font-weight: 500;
            color: var(--tile-strong);
            background: var(--paper);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
        }
        .season-chip:hover:not(.off) {
            background: var(--tile);
            color: var(--tile-ink);
        }
        .season-chip.off {
            border-color: var(--rule);
            color: var(--ink-faint);
            background: var(--paper-2);
            text-decoration: line-through;
        }

        .filter-row-footer {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
        }
        .filter-seen-count {
            font-size: 0.7em;
            color: var(--ink-faint);
            letter-spacing: 0.05em;
        }
        .reset-history-btn {
            background: none;
            border: none;
            color: var(--ink-soft);
            font-family: 'Open Sans', sans-serif;
            font-size: 0.7em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            transition: color 0.15s ease;
        }
        .reset-history-btn:hover { color: var(--rec); }

        /* ── Standby screen (loading) ────────────────────────────────────── */
        .loading {
            display: none;
            text-align: center;
            padding: 8px 0 24px;
        }
        .loading.show { display: block; }

        .standby {
            border: 2px solid var(--ink);
            border-radius: 10px;
            overflow: hidden;
            background: var(--paper);
        }

        .standby-bars {
            display: flex;
            height: 74px;
        }
        .standby-bars span { flex: 1; }
        .standby-bars span:nth-child(1) { background: var(--bar-white); }
        .standby-bars span:nth-child(2) { background: var(--bar-yellow); }
        .standby-bars span:nth-child(3) { background: var(--bar-cyan); }
        .standby-bars span:nth-child(4) { background: var(--bar-green); }
        .standby-bars span:nth-child(5) { background: var(--bar-magenta); }
        .standby-bars span:nth-child(6) { background: var(--bar-red); }
        .standby-bars span:nth-child(7) { background: var(--bar-blue); }

        .standby-caption {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.2em;
            letter-spacing: 0.22em;
            color: var(--ink);
            border-top: 2px solid var(--ink);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--rule);
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Result card: a set with a channel bar across the top ────────── */
        .result-card {
            display: none;
            background: var(--paper);
            border: 2px solid var(--rule);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(20, 23, 28, 0.12);
            animation: channel-change 0.32s ease both;
        }
        .result-card.show { display: block; }

        @keyframes channel-change {
            0%   { opacity: 0; transform: translateY(14px) scaleY(0.94); }
            60%  { opacity: 1; }
            100% { opacity: 1; transform: translateY(0) scaleY(1); }
        }

        .card-accent {
            height: 8px;
            background: var(--tile);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 22px 12px;
            border-bottom: 1px solid var(--rule);
            flex-wrap: wrap;
        }

        .now-playing {
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.66em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--rec);
        }

        .show-title {
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.9em;
            letter-spacing: 0.08em;
            color: var(--tile-strong);
            width: 100%;
            line-height: 1;
        }

        /* The "screen" the episode plays on */
        .episode-info {
            position: relative;
            isolation: isolate;
            margin: 20px 22px;
            padding: 20px;
            background: var(--paper-2);
            border-left: 5px solid var(--tile);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Light-surface scanlines need to be dark, not white */
        .episode-info::before {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%),
                repeating-linear-gradient(
                    to bottom,
                    rgba(20, 23, 28, 0.035) 0px,
                    rgba(20, 23, 28, 0.035) 1px,
                    transparent 1px,
                    transparent 3px
                );
        }

        /* Slow tracking bar rolling down the screen */
        .episode-info::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 42px;
            z-index: -1;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 100%);
            animation: tracking 7s linear infinite;
            pointer-events: none;
        }

        @keyframes tracking {
            0%   { top: -60px; }
            100% { top: 100%; }
        }

        /* Episode names keep their own casing — Bebas Neue is caps-only */
        .episode-title {
            font-family: 'Open Sans', sans-serif;
            font-weight: 800;
            font-size: 1.3em;
            line-height: 1.25;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .season-episode {
            display: inline-block;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.75em;
            font-weight: 500;
            letter-spacing: 0.14em;
            color: var(--tile-ink);
            background: var(--tile);
            border-radius: 4px;
            padding: 4px 9px;
            margin-bottom: 14px;
        }
        .season-episode:empty { display: none; }

        .description {
            line-height: 1.7;
            color: var(--ink);
            font-size: 0.92em;
        }

        .meta-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--rule);
        }

        .meta-item {
            text-align: center;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 6px;
            padding: 10px 6px;
        }

        .meta-label {
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.62em;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            margin-bottom: 5px;
        }

        .meta-value {
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.25em;
            letter-spacing: 0.04em;
            color: var(--tile-strong);
        }

        /* ── Remote-control buttons ──────────────────────────────────────── */
        .try-again-btn {
            display: block;
            width: calc(100% - 44px);
            margin: 0 22px 22px;
            padding: 15px;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Bebas Neue', 'Open Sans', sans-serif;
            font-size: 1.05em;
            letter-spacing: 0.18em;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
        }
        .try-again-btn:hover { background: #000; }
        .try-again-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        /* The reset button rendered inside the meta grid by displayAllSeen() */
        .meta-info .try-again-btn {
            width: 100%;
            margin: 0;
        }

        /* ── Signal lost (errors) ────────────────────────────────────────── */
        .error-message {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--paper);
            border: 2px solid var(--rec);
            border-left-width: 8px;
            border-radius: 8px;
            color: var(--ink);
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 0.88em;
            line-height: 1.5;
        }
        .error-message.show { display: flex; }
        .error-message::before {
            content: 'NO SIGNAL';
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.72em;
            letter-spacing: 0.12em;
            color: var(--rec);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Sign-off ────────────────────────────────────────────────────── */
        .signoff {
            margin-top: 28px;
            text-align: center;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.64em;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }
        .signoff a { color: var(--ink-soft); }

        /* ── Responsive ──────────────────────────────────────────────────── */
        @media (max-width: 480px) {
            h1 { font-size: 3em; }
            .container { padding-top: 20px; }
            .show-buttons { gap: 10px; }
            .show-btn { padding: 20px 10px 16px; font-size: 1.25em; }
            .episode-info { margin: 16px; padding: 16px; }
            .try-again-btn { width: calc(100% - 32px); margin: 0 16px 16px; }
            .card-head { padding: 14px 16px 10px; }
        }

        /* ── Motion preferences ──────────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .rec-dot,
            .episode-info::after,
            .result-card,
            .spinner {
                animation: none;
            }
            .rec-dot { opacity: 1; }
            .episode-info::after { display: none; }
            .show-btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="color-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="scan-lines" aria-hidden="true"></div>

    <div class="container">
        <div class="status-strip">
            <span class="on-air"><span class="rec-dot"></span>On Air</span>
            <span class="source-tag">Ch. 1&ndash;6</span>
            <span class="timecode" id="timecode">00:00:00:00</span>
        </div>

        <h1>WHAT SHOULD<br>WE WATCH?</h1>
        <p class="subtitle">Pick a channel &mdash; get an episode</p>

        <div class="masthead-rule"></div>

        <div class="error-message" id="errorMessage"></div>

        <div class="show-buttons">
            <button class="show-btn seinfeld-btn" onclick="getRandomEpisode('seinfeld')">
                <span class="ch-label">CH 01</span>
                <span class="btn-emoji">🥨</span>
                Seinfeld
                <span class="btn-seen-count" id="seen-seinfeld"></span>
            </button>
            <button class="show-btn familyguy-btn" onclick="getRandomEpisode('familyguy')">
                <span class="ch-label">CH 02</span>
                <span class="btn-emoji">🐶</span>
                Family Guy
                <span class="btn-seen-count" id="seen-familyguy"></span>
            </button>
            <button class="show-btn simpsons-btn" onclick="getRandomEpisode('simpsons')">
                <span class="ch-label">CH 03</span>
                <span class="btn-emoji">🍩</span>
                The Simpsons
                <span class="btn-seen-count" id="seen-simpsons"></span>
            </button>
            <button class="show-btn southpark-btn" onclick="getRandomEpisode('southpark')">
                <span class="ch-label">CH 04</span>
                <span class="btn-emoji">⛰️</span>
                South Park
                <span class="btn-seen-count" id="seen-southpark"></span>
            </button>
            <button class="show-btn koth-btn" onclick="getRandomEpisode('koth')">
                <span class="ch-label">CH 05</span>
                <span class="btn-emoji">🏠</span>
                King of the Hill
                <span class="btn-seen-count" id="seen-koth"></span>
            </button>
            <button class="show-btn laworder-btn" onclick="getRandomEpisode('laworder')">
                <span class="ch-label">CH 06</span>
                <span class="btn-emoji">⚖️</span>
                Law &amp; Order
                <span class="btn-seen-count" id="seen-laworder"></span>
            </button>
        </div>

        <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilterPanel()">&#9881; Channel Guide &#9660;</button>
        <div class="filter-panel" id="filterPanel"></div>

        <div class="loading" id="loading">
            <div class="standby">
                <div class="standby-bars" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <p class="standby-caption"><span class="spinner"></span>Please Stand By</p>
            </div>
        </div>

        <div id="resultCard" class="result-card">
            <div class="card-accent"></div>
            <div class="card-head">
                <span class="rec-dot"></span>
                <span class="now-playing">Now Playing</span>
                <div class="show-title" id="showTitle"></div>
            </div>
            <div class="episode-info">
                <div class="episode-title" id="episodeTitle"></div>
                <div class="season-episode" id="seasonEpisode"></div>
                <div class="description" id="description"></div>
                <div class="meta-info" id="metaInfo"></div>
            </div>
            <button class="try-again-btn" onclick="hideResult()">&#9198; Pick Another Channel</button>
        </div>

        <p class="signoff">Episode data by <a href="https://www.tvmaze.com/api">TVMaze</a></p>
    </div>

    <script>
        // TVMaze is keyless; one /episodes call per show returns the full
        // catalogue (title, summary, runtime, rating, airdate) in one shot.
        const showData = {
            familyguy: { name: "Family Guy",       tvmazeId: 84 },
            simpsons:  { name: "The Simpsons",     tvmazeId: 83 },
            seinfeld:  { name: "Seinfeld",         tvmazeId: 530 },
            southpark: { name: "South Park",       tvmazeId: 112 },
            koth:      { name: "King of the Hill", tvmazeId: 115 },
            laworder:  { name: "Law & Order",      tvmazeId: 562 }
        };

        // Hardcoded defaults so the filter panel works immediately.
        // Overridden from the TVMaze episode list on first pick.
        const defaultSeasons = {
            seinfeld: 9, familyguy: 22, simpsons: 36, southpark: 27,
            koth: 13, laworder: 20
        };

        // ── Episode catalogue (TVMaze) ───────────────────────────────────────

        const EPISODES_TTL_MS = 24 * 60 * 60 * 1000;

        function getCachedEpisodes(key) {
            try {
                const raw = JSON.parse(localStorage.getItem(`episodes_${key}`) || 'null');
                if (!raw || !Array.isArray(raw.episodes)) return null;
                return raw;
            } catch { return null; }
        }

        async function getEpisodes(key) {
            const cached = getCachedEpisodes(key);
            if (cached && Date.now() - cached.fetched < EPISODES_TTL_MS) return cached.episodes;

            try {
                const res = await fetch(`https://api.tvmaze.com/shows/${showData[key].tvmazeId}/episodes`);
                if (!res.ok) throw new Error(`TVMaze returned ${res.status}`);
                const data = await res.json();
                const episodes = data.map(ep => ({
                    s: ep.season,
                    e: ep.number,
                    name: ep.name,
                    summary: stripHtml(ep.summary),
                    runtime: ep.runtime,
                    airdate: ep.airdate,
                    rating: ep.rating && ep.rating.average
                }));
                localStorage.setItem(`episodes_${key}`, JSON.stringify({ fetched: Date.now(), episodes }));
                return episodes;
            } catch (err) {
                // Offline / API hiccup: fall back to a stale catalogue if we have one
                if (cached) return cached.episodes;
                throw err;
            }
        }

        function stripHtml(html) {
            if (!html) return '';
            return new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();
        }

        // ── Storage helpers ──────────────────────────────────────────────────

        function seenKey(season, epNum) { return `s${season}e${epNum}`; }

        function getSeenMap(key) {
            return JSON.parse(localStorage.getItem(`seen_${key}`) || '{}');
        }
        function getSeen(key) { return new Set(Object.keys(getSeenMap(key))); }
        function addSeen(key, season, epNum) {
            const map = getSeenMap(key);
            map[seenKey(season, epNum)] = { s: season, e: epNum };
            localStorage.setItem(`seen_${key}`, JSON.stringify(map));
        }

        // One-time migration: watch history used to be keyed by OMDb imdbID
        // (tt…). Re-key by season/episode so it survives the TVMaze switch.
        function migrateSeenHistory() {
            Object.keys(showData).forEach(key => {
                const map = getSeenMap(key);
                if (!Object.keys(map).some(k => k.startsWith('tt'))) return;
                const migrated = {};
                Object.values(map).forEach(v => {
                    if (v && v.s && v.e) migrated[seenKey(v.s, v.e)] = { s: v.s, e: v.e };
                });
                localStorage.setItem(`seen_${key}`, JSON.stringify(migrated));
            });
        }
        function resetSeen(key) {
            localStorage.removeItem(`seen_${key}`);
            updateButtonBadges();
            renderFilterPanel();
        }
        function seenCountForSeason(key, season) {
            return Object.values(getSeenMap(key)).filter(v => v.s === season).length;
        }

        function getExcluded(key) {
            return new Set(JSON.parse(localStorage.getItem(`excluded_${key}`) || '[]'));
        }
        function toggleExcluded(key, season) {
            const ex = getExcluded(key);
            ex.has(season) ? ex.delete(season) : ex.add(season);
            localStorage.setItem(`excluded_${key}`, JSON.stringify([...ex]));
            renderFilterPanel();
        }

        function getTotalSeasons(key) {
            const cached = getCachedEpisodes(key);
            if (cached) return Math.max(...cached.episodes.map(ep => ep.s));
            return defaultSeasons[key] || null;
        }
        function getCachedEpCount(key, season) {
            const cached = getCachedEpisodes(key);
            if (!cached) return null;
            const n = cached.episodes.filter(ep => ep.s === season).length;
            return n || null;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ── UI helpers ───────────────────────────────────────────────────────

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.innerHTML = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 8000);
        }
        function showLoading() {
            document.querySelectorAll('.show-btn').forEach(b => b.disabled = true);
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultCard').classList.remove('show');
        }
        function hideLoading() {
            document.querySelectorAll('.show-btn').forEach(b => b.disabled = false);
            document.getElementById('loading').classList.remove('show');
        }

        function updateButtonBadges() {
            Object.keys(showData).forEach(key => {
                const el = document.getElementById(`seen-${key}`);
                if (!el) return;
                const count = Object.keys(getSeenMap(key)).length;
                el.textContent = count > 0 ? `${count} seen` : '';
            });
        }

        function toggleFilterPanel() {
            const panel = document.getElementById('filterPanel');
            const btn   = document.getElementById('filterToggleBtn');
            const open  = panel.classList.toggle('open');
            btn.textContent = open ? '⚙ Channel Guide ▲' : '⚙ Channel Guide ▼';
            if (open) renderFilterPanel();
        }

        function renderFilterPanel() {
            const panel = document.getElementById('filterPanel');
            if (!panel || !panel.classList.contains('open')) return;
            panel.innerHTML = '';

            Object.entries(showData).forEach(([key, show]) => {
                const total = getTotalSeasons(key);
                if (!total) return;

                const excluded  = getExcluded(key);
                const totalSeen = Object.keys(getSeenMap(key)).length;

                const row = document.createElement('div');
                row.className = `filter-show-row ${key}-row`;

                const label = document.createElement('div');
                label.className = 'filter-show-label';
                label.textContent = show.name;
                row.appendChild(label);

                const chips = document.createElement('div');
                chips.className = `season-chips ${key}-chips`;
                for (let s = 1; s <= total; s++) {
                    const chip = document.createElement('button');
                    chip.className = 'season-chip' + (excluded.has(s) ? ' off' : '');
                    chip.textContent = `S${s}`;
                    const seen       = seenCountForSeason(key, s);
                    const cachedTotal = getCachedEpCount(key, s);
                    if (seen > 0) chip.title = cachedTotal ? `${seen}/${cachedTotal} watched` : `${seen} watched`;
                    chip.onclick = () => toggleExcluded(key, s);
                    chips.appendChild(chip);
                }
                row.appendChild(chips);

                if (totalSeen > 0) {
                    const footer = document.createElement('div');
                    footer.className = 'filter-row-footer';

                    const countEl = document.createElement('span');
                    countEl.className = 'filter-seen-count';
                    countEl.textContent = `${totalSeen} episode${totalSeen !== 1 ? 's' : ''} watched`;
                    footer.appendChild(countEl);

                    const resetBtn = document.createElement('button');
                    resetBtn.className = 'reset-history-btn';
                    resetBtn.textContent = 'Clear history';
                    resetBtn.onclick = () => {
                        if (confirm(`Clear watched history for ${show.name}?`)) resetSeen(key);
                    };
                    footer.appendChild(resetBtn);
                    row.appendChild(footer);
                }

                panel.appendChild(row);
            });
        }

        // ── Episode picker ───────────────────────────────────────────────────

        async function getRandomEpisode(showKey) {
            showLoading();

            try {
                const episodes = await getEpisodes(showKey);
                const seen     = getSeen(showKey);
                const excluded = getExcluded(showKey);

                const candidates = episodes.filter(ep =>
                    !excluded.has(ep.s) && !seen.has(seenKey(ep.s, ep.e))
                );

                if (candidates.length === 0) {
                    hideLoading();
                    const allExcluded = episodes.every(ep => excluded.has(ep.s));
                    if (allExcluded) showError('All seasons excluded — re-enable some in the ⚙ Channel Guide.');
                    else displayAllSeen(showKey);
                    return;
                }

                const ep = candidates[Math.floor(Math.random() * candidates.length)];

                addSeen(showKey, ep.s, ep.e);
                updateButtonBadges();
                renderFilterPanel();

                displayEpisode(showKey, ep);
                hideLoading();

            } catch (error) {
                hideLoading();
                showError(error.message);
            }
        }

        function displayEpisode(showKey, ep) {
            const resultCard = document.getElementById('resultCard');
            resultCard.className = `result-card show ${showKey}-card`;

            document.getElementById('showTitle').textContent     = showData[showKey].name;
            document.getElementById('episodeTitle').textContent  = ep.name;
            document.getElementById('seasonEpisode').textContent = `S${String(ep.s).padStart(2,'0')} E${String(ep.e).padStart(2,'0')}`;
            document.getElementById('description').textContent   = ep.summary || 'No description available.';

            let metaHtml = '';
            if (ep.airdate)
                metaHtml += `<div class="meta-item"><div class="meta-label">Released</div><div class="meta-value">${ep.airdate}</div></div>`;
            if (ep.rating)
                metaHtml += `<div class="meta-item"><div class="meta-label">Rating</div><div class="meta-value">&#9733; ${ep.rating}</div></div>`;
            if (ep.runtime)
                metaHtml += `<div class="meta-item"><div class="meta-label">Runtime</div><div class="meta-value">${ep.runtime} min</div></div>`;

            document.getElementById('metaInfo').innerHTML = metaHtml;
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function displayAllSeen(showKey) {
            const resultCard = document.getElementById('resultCard');
            resultCard.className = `result-card show ${showKey}-card`;
            document.getElementById('showTitle').textContent     = showData[showKey].name;
            document.getElementById('episodeTitle').textContent  = "You've seen them all!";
            document.getElementById('seasonEpisode').textContent = '';
            document.getElementById('description').textContent   =
                `Every available episode has been marked as watched. Reset your history to start fresh.`;
            document.getElementById('metaInfo').innerHTML =
                `<div style="grid-column:1/-1">
                    <button class="try-again-btn"
                        onclick="resetSeen('${showKey}'); hideResult();">
                        ↺ Reset ${showData[showKey].name} History
                    </button>
                </div>`;
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideResult() {
            document.getElementById('resultCard').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── Broadcast timecode (HH:MM:SS:FF at 30 fps) ───────────────────────

        function startTimecode() {
            const el = document.getElementById('timecode');
            if (!el) return;
            const pad = n => String(n).padStart(2, '0');
            const tick = () => {
                const now = new Date();
                const frames = Math.floor(now.getMilliseconds() / 1000 * 30);
                el.textContent =
                    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}:${pad(frames)}`;
            };
            tick();
            setInterval(tick, 100);
        }

        // ── Init ─────────────────────────────────────────────────────────────
        migrateSeenHistory();
        updateButtonBadges();
        startTimecode();
    </script>
</body>
</html>
